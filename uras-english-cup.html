<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uras English Cup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: sticker-album cards on a mown football pitch; player card + one mission at a time, big touch targets. Single deliberate bright theme. */
:root{
  --pitch:#2f9a57; --pitch-2:#2a8c4f; --ink:#132029; --paper:#ffffff; --paper-2:#eef7f0;
  --sun:#ffc93c; --red:#ef4444; --sky:#3b82f6; --muted:#55665c; --ok:#16a34a; --no:#dc2626;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:20px; --shadow:0 5px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--body);font-weight:600;font-size:16px;color:var(--ink);min-height:100vh;
  background:var(--pitch) repeating-linear-gradient(90deg,var(--pitch) 0 90px,var(--pitch-2) 90px 180px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff}
.topbar .in{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;margin-right:auto}
.brand svg{width:34px;height:34px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-weight:900;font-variant-numeric:tabular-nums}
.tbtn{background:var(--sun);color:var(--ink);border:2px solid #fff;border-radius:12px;padding:6px 12px;font-weight:900;cursor:pointer}
.tbtn.alt{background:transparent;color:#fff}

.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px;display:grid;gap:24px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.eyebrow{font-weight:900;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{font-family:var(--display);font-size:22px;padding:14px 26px;border:3px solid var(--ink);border-radius:16px;background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--paper)}
.btn.small{font-size:17px;padding:9px 16px;box-shadow:0 3px 0 var(--ink)}
.link{background:none;border:0;text-decoration:underline;color:var(--muted);cursor:pointer;font-weight:800}

/* Hero: player card + mission */
.hero{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:stretch}
.pcard{background:var(--ink) repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px);color:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 5px 0 #0a1217;
  padding:22px 18px 20px;display:grid;justify-items:center;align-content:start;gap:14px;text-align:center}
.sticker{position:relative;width:180px;aspect-ratio:1;max-width:100%;transform:rotate(-4deg);margin-top:4px}
.ph{width:100%;height:100%;border-radius:50%;overflow:hidden;border:8px solid #fff;box-shadow:0 0 0 4px var(--sun),0 7px 0 4px #0a1217;background:var(--paper-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-empty{width:100%;height:100%;display:grid;place-items:center;align-content:center;gap:4px;color:var(--ink);font-weight:900;cursor:pointer;font-size:15px;text-align:center;padding:10px}
.ph-empty b{font-size:40px;font-weight:400;line-height:1}
.pname{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%) rotate(2deg);background:var(--red);color:#fff;font-family:var(--display);font-size:26px;padding:2px 18px;border:3px solid var(--ink);border-radius:10px;letter-spacing:.06em}
.pnum{position:absolute;right:-4px;top:-4px;width:52px;height:52px;border-radius:50%;background:var(--sun);color:var(--ink);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:24px;transform:rotate(8deg)}
.pinfo{display:grid;gap:4px;margin-top:10px;width:100%}
.pinfo .eyebrow{color:#9fb3a7}
.pinfo b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--sun)}
.pinfo small{color:#c9d6ce;font-weight:800}
.pbar{height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--sun)}

.mission{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center}
.mission h1{font-size:clamp(28px,4.4vw,42px);line-height:1.05;margin-top:6px}
.tasks{list-style:none;padding:0;margin:16px 0 14px;display:grid;gap:10px}
.tasks li{display:flex;gap:12px;align-items:center;background:var(--paper-2);border-radius:14px;padding:10px 14px}
.tasks .ic{font-size:28px;width:40px;text-align:center}
.tasks b{display:block;font-weight:900}
.tasks small{color:var(--muted);font-size:14px}
.tasks li.done{opacity:.55}
.tasks li.done b::after{content:" ✓";color:var(--ok)}
.chunk{display:flex;gap:10px;align-items:center;border:3px dashed var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:16px}
.chunk b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.chunk small{color:var(--muted);font-weight:800}
.chunk .speak{flex:none}
.reward{background:var(--ink);color:#fff;border-radius:18px;padding:18px;text-align:center;display:grid;gap:6px}
.reward svg{width:100%;max-width:220px;margin:0 auto;height:auto}
.reward .nm{font-family:var(--display);font-size:22px;color:var(--sun)}
.reward .eyebrow{color:#c9d6ce}
.meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-weight:800}

/* Weeks roadmap */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;color:#fff;flex-wrap:wrap}
.sec-h h2{font-size:26px;text-shadow:0 3px 0 var(--ink)}
.sec-h p{font-weight:800;opacity:.92}
.levels{display:grid;gap:16px;margin-top:12px}
.lvl-h{display:flex;gap:10px;align-items:baseline;color:#fff;flex-wrap:wrap}
.lvl-h b{font-family:var(--display);font-weight:400;font-size:20px;background:var(--ink);padding:2px 12px;border-radius:10px}
.lvl-h span{font-weight:800}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px}
.wtab{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:4px;box-shadow:0 4px 0 var(--ink);min-width:0}
.wtab.on{background:var(--sun)}
.wtab:disabled{cursor:not-allowed;background:#dfe7e2;color:var(--muted);box-shadow:0 4px 0 #8a9a90;border-color:#8a9a90}
.wnum{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.wname{font-family:var(--display);font-size:19px;line-height:1.1}
.wbar{height:8px;background:rgba(19,32,41,.15);border-radius:6px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--ok)}

/* Fixtures */
.fixtures{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.fx{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:14px;display:grid;gap:8px;align-content:start;box-shadow:0 4px 0 var(--ink)}
.fx h3{font-size:20px}
.fx .ti{font-size:14px;color:var(--muted);display:grid;gap:2px}
.fx .st{font-weight:900;font-size:13px;border-radius:999px;padding:3px 10px;justify-self:start}
.fx.done .st{background:#dcfce7;color:#166534}
.fx.cur{background:var(--sun);animation:pulse 1.6s ease-in-out infinite}
.fx.cur .st{background:var(--ink);color:#fff}
.fx.lock{background:#dfe7e2;color:var(--muted);box-shadow:0 4px 0 #8a9a90;border-color:#8a9a90}
.fx.lock .st{background:#fff}
.fx.open .st{background:#e0ecff;color:#1d4ed8}
.fx button{justify-self:start}
@keyframes pulse{50%{transform:translateY(-4px)}}

/* Word wall */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.wcard{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px;display:grid;gap:4px;justify-items:center;align-content:start;cursor:pointer;box-shadow:0 3px 0 var(--ink);text-align:center;min-width:0;overflow:hidden}
.wcard .pic{height:70px}
.wcard .pic svg{width:100%;height:100%;max-width:110px}
.wcard .pic.emo{font-size:46px}
.wcard b{font-family:var(--display);font-size:20px;font-weight:400}
.wcard small{color:var(--muted)}
.wcard em{font-style:normal;font-size:13px;color:var(--ink);background:var(--paper-2);border-radius:8px;padding:3px 6px}

/* Pictures */
.pic{display:grid;place-items:center;width:100%;line-height:1}
.pic svg{width:min(140px,85%);height:auto;display:block}
.pic.emo{font-size:clamp(46px,11vw,70px)}
.pic.count{height:96px}
.pic.count svg{width:100%;height:100%;max-width:none}

/* Play overlay */
.overlay{position:fixed;inset:0;z-index:50;overflow-y:auto;background:var(--pitch) repeating-linear-gradient(90deg,var(--pitch) 0 90px,var(--pitch-2) 90px 180px)}
.play-in{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 28px);display:grid;gap:14px}
.phead{display:flex;align-items:center;gap:12px;color:#fff;flex-wrap:wrap}
.phead h2{font-size:22px;text-shadow:0 2px 0 var(--ink)}
.prog{flex:1 1 200px;display:flex;gap:6px}
.prog i{flex:1;height:16px;border-radius:9px;background:rgba(255,255,255,.35);border:2px solid var(--ink)}
.prog i.f{background:var(--sun)}
.xbtn{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:900;cursor:pointer}
#stage{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:var(--shadow);padding:22px;display:grid;gap:18px}
.hint{font-weight:800;font-size:18px}
.saytxt{font-family:var(--display);font-size:clamp(28px,6vw,42px);line-height:1.1;color:var(--ink);background:var(--paper-2);border:3px dashed var(--ink);border-radius:14px;padding:6px 18px}
.center{text-align:center}
.q{display:grid;justify-items:center;gap:10px;text-align:center}
.speak{background:var(--sky);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 16px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.speak.big{font-size:44px;width:110px;height:110px;border-radius:50%;padding:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px}
.opt{background:var(--paper-2);border:3px solid var(--ink);border-radius:18px;padding:16px 8px;min-height:130px;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 var(--ink)}
.opt.word{min-height:76px;font-family:var(--display);font-size:clamp(22px,5vw,32px)}
.opt.ok{background:#bbf7d0;border-color:var(--ok)}
.opt.no,.tile.no{animation:shake .4s;background:#fee2e2}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fb{min-height:34px;text-align:center;font-size:22px;font-weight:800;opacity:0;transition:opacity .2s;display:grid;gap:2px}
.fb.show{opacity:1}
.fb b{font-family:var(--display);font-weight:400;color:var(--ok)}
.fb small{font-size:17px;color:var(--muted)}
.qrow{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.qrow > div{display:grid;gap:8px;justify-items:center}
.qpic{width:170px;height:130px;background:var(--paper-2);border-radius:18px;border:3px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.qpic .pic{height:100%}
.qpic .pic svg{width:85%;height:85%}

/* Penalty */
.pen{position:relative;height:210px;border-radius:18px;border:3px solid var(--ink);overflow:hidden;background:var(--pitch) repeating-linear-gradient(90deg,var(--pitch) 0 50px,var(--pitch-2) 50px 100px)}
.goal{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(330px,82%);height:104px;border:7px solid #fff;border-bottom:0;border-radius:4px 4px 0 0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.35) 0 2px,transparent 2px 14px),repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 2px,transparent 2px 14px)}
.keeper{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:52px;transition:transform .35s ease-out}
.keeper svg{width:100%;height:auto;display:block}
.ball{position:absolute;bottom:12px;left:50%;font-size:40px;transform:translate(-50%,0);transition:transform .55s cubic-bezier(.2,.7,.3,1)}
.spot{position:absolute;bottom:6px;left:50%;width:70px;height:10px;transform:translateX(-50%);border-radius:50%;background:rgba(255,255,255,.4)}
.score{position:absolute;right:10px;bottom:10px;background:var(--ink);color:#fff;border-radius:10px;padding:4px 10px;font-weight:900}
.golt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:64px;color:var(--sun);-webkit-text-stroke:3px var(--ink);pointer-events:none;opacity:0}
.golt.on{animation:gol 1.2s ease-out}
@keyframes gol{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}80%{opacity:1;transform:scale(1)}100%{opacity:0}}

/* Race */
.road{position:relative;height:96px;border-radius:16px;border:3px solid var(--ink);background:#3a4452;overflow:hidden}
.lane{position:absolute;left:0;right:0;top:50%;height:6px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,#fff 0 26px,transparent 26px 50px);opacity:.7}
.finish{position:absolute;right:0;top:0;bottom:0;width:26px;background:conic-gradient(#fff 25%,#132029 0 50%,#fff 0 75%,#132029 0) 0 0/13px 13px}
.racer{position:absolute;bottom:14px;width:96px;transition:left .45s ease-out}
.racer svg{width:100%;height:auto;display:block}
.slots{display:flex;gap:clamp(3px,1vw,8px);justify-content:center;flex-wrap:nowrap}
.slot{width:clamp(22px,7vw,48px);height:clamp(40px,10vw,62px);border-bottom:5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:clamp(22px,6vw,36px)}
.slot em{font-style:normal;color:#c5d3ca}
.slot.filled{color:var(--ok)}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:60px;height:60px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);font-family:var(--display);font-size:32px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.tile:disabled{opacity:.2;cursor:default}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mcard{aspect-ratio:3/4;max-width:100%;border:3px solid var(--ink);border-radius:16px;cursor:pointer;display:grid;place-items:center;padding:6px;box-shadow:0 4px 0 var(--ink);
  background:var(--sky) repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 8px,transparent 8px 16px)}
.mem.many .mcard{aspect-ratio:1}
.mcard .back{font-family:var(--display);font-size:40px;color:#fff;-webkit-text-stroke:2px var(--ink)}
.mcard:not(.up) .face{display:none}
.mcard.up{background:var(--paper)}
.mcard.up .back{display:none}
.mcard.match{background:#bbf7d0;border-color:var(--ok)}
.mcard .face{width:100%}
.mcard .face b{font-family:var(--display);font-weight:400;font-size:clamp(16px,4.2vw,28px);word-break:normal;overflow-wrap:normal;hyphens:none}
.mcard .face b.lg{font-size:clamp(11px,2.9vw,19px)}
.opt.word.lg{font-size:clamp(15px,3.6vw,24px)}
.opt.word{min-width:0;overflow-wrap:normal;word-break:normal}
.mcard .pic svg{width:90%}
.mcard .pic.emo{font-size:clamp(30px,8vw,52px)}
.mcard .pic.count{height:auto;aspect-ratio:1}

/* Fill the Gap (writing) */
.gapword{display:inline-flex;gap:clamp(3px,1vw,6px);vertical-align:middle;flex-wrap:nowrap;justify-content:center;max-width:100%}
.gapword .gapfix,.gapword .gapbox{min-width:0;flex:0 1 auto}
.gapword.big{display:flex;margin:0 auto}
.gapfix,.gapbox{width:clamp(22px,7vw,48px);height:clamp(34px,9vw,58px);font-size:clamp(18px,5vw,32px) !important;border:3px solid var(--ink);border-radius:12px;font-family:var(--display);font-size:32px;text-align:center;display:inline-grid;place-items:center;background:var(--paper-2);color:var(--ink);padding:0;line-height:1}
.gapbox{background:#fff;border-style:dashed;box-shadow:0 3px 0 var(--ink);font-family:var(--display)}
.gapbox:focus{outline:4px solid var(--sun);outline-offset:2px}
.gapbox.ok{border-style:solid;background:#bbf7d0;color:var(--ok)}
.gapbox.no{animation:shake .4s;background:#fee2e2}
.gapsent{font-size:clamp(22px,4.5vw,30px);font-weight:800;text-align:center;line-height:2.6}

/* Typing Turbo */
.typing-card{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center}
.typing-card h2{font-size:32px;margin-top:2px}
.typing-card .meta{margin-top:6px}
.lvl-badge{background:var(--ink);color:var(--sun);font-family:var(--display);font-size:22px;padding:6px 14px;border-radius:12px;display:inline-block}
.tt-badges{display:grid;gap:4px;justify-items:center;color:var(--muted);font-weight:800}
.tt-levels{grid-column:1 / -1;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tt-lv{background:var(--paper-2);border:3px solid var(--ink);border-radius:12px;padding:6px 4px;cursor:pointer;box-shadow:0 3px 0 var(--ink);display:grid;gap:1px;min-width:0}
.tt-lv b{font-family:var(--display);font-weight:400;font-size:16px}
.tt-lv small{font-weight:800;font-size:11px;color:var(--muted)}
.tt-lv.on{background:var(--sun)}
.tt-lv:disabled{cursor:not-allowed;opacity:.5;box-shadow:none}
@media (max-width:640px){.tt-levels{grid-template-columns:repeat(3,1fr)}}
.tt-top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.tt-count{font-weight:900}
.tt-pic{height:90px;display:grid;place-items:center}
.tt-pic .pic svg{width:120px}
.tt-pic .pic.emo{font-size:64px}
.tt-pic .pic{height:100%}
/* "jump": there is no jumping emoji, so the child picture hops over its own shadow */
.pic.jumpy svg{width:min(96px,70%);max-height:100%}
.pic.jumpy .jfig{animation:jumpy .9s cubic-bezier(.3,0,.4,1) infinite}
.pic.jumpy .jsh{transform-origin:50px 103px;animation:jumpsh .9s cubic-bezier(.3,0,.4,1) infinite}
@keyframes jumpy{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes jumpsh{0%,100%{transform:scale(1)}50%{transform:scale(.6);opacity:.5}}
.pic.emo img.e3d{width:1.2em;height:1.2em;object-fit:contain;display:block;margin:auto;pointer-events:none;-webkit-user-drag:none}
.tt-picrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.tt-tr{font-weight:800;font-size:18px;color:var(--muted);background:rgba(255,255,255,.08);border:2px solid currentColor;border-radius:999px;padding:3px 12px}
#stage.neon .tt-tr{color:#e9d5ff}
.tt-pic .pic svg{height:100%}
.tt-word{display:flex;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-size:clamp(36px,9vw,68px);gap:2px;min-height:1.2em}
.tt-word span{padding:0 2px;border-bottom:5px solid transparent;color:#9fb0a6}
.tt-word span.d{color:var(--ok)}
.tt-word span.c{color:var(--ink);border-bottom-color:var(--sun)}
.tt-word span.x{animation:shake .35s;color:var(--no)}
.tt-word span.sp{min-width:.5em}
.tt-word .tt-grp{display:inline-flex;white-space:nowrap;padding:0;border:0}
.kb{display:grid;gap:6px;max-width:620px;margin:0 auto;width:100%}
.kb-row{display:flex;gap:5px;justify-content:center}

/* Word Tower */

.tw-q{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}

.tw-banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:5;background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:10px 18px;text-align:center;display:grid;gap:2px;box-shadow:0 5px 0 var(--ink);animation:gol 1.9s ease-out forwards;white-space:nowrap}

.tw-ground{background:repeating-linear-gradient(90deg,#ffc93c 0 30px,transparent 30px 60px) 0 8px/100% 4px no-repeat,#1d1530;border-top:4px solid #22d3ee;box-shadow:0 0 16px #22d3ee}

/* Neon city sunset theme */
body{background:#14072e}
.cityscape{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#14072e 0%,#2d0b55 28%,#7a1f7a 52%,#d93a7a 72%,#ff9a56 100%)}

/* Level-up fireworks + trophy */
.fw{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.fw-cup{position:absolute;left:50%;top:120px;width:96px;opacity:0;transform:translate(-50%,-50%) scale(0);animation:cupin 6.5s ease-out forwards;filter:drop-shadow(0 0 14px rgba(255,201,60,.8))}
.fw-cup svg{width:100%;height:auto;display:block}
@keyframes cupin{0%{opacity:1;transform:translate(-50%,-50%) scale(0) rotate(-25deg)}7%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(8deg)}12%{transform:translate(-50%,-50%) scale(1) rotate(0)}20%{transform:translate(-50%,-56%) scale(1)}28%{transform:translate(-50%,-50%) scale(1)}92%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(.9)}}
.fw-burst{position:absolute;width:0;height:0}
.fw-burst i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);opacity:0;animation:fwp 1.2s cubic-bezier(.12,.7,.3,1) both}
@keyframes fwp{0%{opacity:0;transform:translate(0,0) scale(1)}6%{opacity:1;transform:translate(0,0) scale(1.2)}75%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 40px)) scale(.3)}}
@media (prefers-reduced-motion:reduce){.fw-cup{animation:none !important;opacity:1;transform:translate(-50%,-50%)}}
.fw-msg{position:absolute;left:50%;top:172px;transform:translateX(-50%);background:#0d0420;color:#fff;border:3px solid #ffc93c;border-radius:16px;padding:8px 18px;text-align:center;display:grid;gap:2px;width:max-content;max-width:90vw;opacity:0;animation:msgin 7s ease-out forwards}

@keyframes msgin{0%{opacity:0;transform:translateX(-50%) scale(.6)}6%{opacity:1;transform:translateX(-50%) scale(1.08)}10%{transform:translateX(-50%) scale(1)}93%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0}}

/* Sentence Builder */
.sb-para{background:#fffdf5;border:3px solid var(--ink);border-radius:16px;padding:12px 16px;text-align:left;font-size:20px;line-height:1.6;font-weight:800;justify-self:stretch}

.sb-tile{font-family:var(--display);font-size:clamp(22px,4.6vw,30px);padding:8px 16px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;line-height:1.1}

/* Celebration sits at the top; screen content starts below it */

/* Mission card, neon: WEEK badge on the left, mission steps + Kick off on the right */

.pc-board{display:flex;justify-content:center;align-items:center;gap:14px;background:#0d0420;border:3px solid #ffc93c;border-radius:16px;padding:6px 16px;font-family:var(--display);justify-self:center;box-shadow:0 0 16px rgba(255,201,60,.45)}

/* Word Quest: level tabs, pack map, flip card */

const NAME_SAY={'Uras':'','İmge':'Eemgeh','Halit':'Hahlit','Ela':'Ella','Beyazıt':'Bayahzut','Pars':'Parss','Defne':'Defneh','Elisa':'Eleesa','Ayaz':'Ahyahz','Aras':'Ahrahss','Mirel':'Meerel','Bade':'Bahdeh','Buse':'Booseh','İrem':'Eerem','Birsen':'Beersen','Selahattin':'Selahatteen','Pınar':'Punahr','Balıkesir':'Bahlukeseer','Bilnet':'Beelnet'};
const NAME_RE=new RegExp('(^|[^\\p{L}])('+Object.keys(NAME_SAY).join('|')+')(?=[^\\p{L}]|$)','gu');
const sayFix=t=>String(t).replace(NAME_RE,(m,pre,n)=>pre+(n==='Uras'?(S.urasSay||'Oorahss'):NAME_SAY[n]));
function say(texts){
 if(!('speechSynthesis' in window))return;
 if(!voice)pickVoice();
 try{speechSynthesis.cancel();[].concat(texts).forEach(t=>{const u=new SpeechSynthesisUtterance(sayFix(t));u.lang=voice?voice.lang.replace('_','-'):'en-US';u.rate=S.rate;if(voice)u.voice=voice;speechSynthesis.speak(u)})}catch(e){}
}
let actx=null;
function tone(f,dur,type,vol,when){
 if(!S.sfx)return;
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;
  const t0=actx.currentTime+(when||0);g.gain.setValueAtTime(vol||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+.02)}catch(e){}
}

const bad=()=>tone(220,.22,'triangle',.12);

/* bell: fundamental + bell-like partials with a long decay */
function bell(f,when){
 if(!S.sfx)return;
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [[1,.28],[2.76,.08],[5.4,.035]].forEach(([m,v])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f*m;
   const t0=actx.currentTime+when;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+1.5);
   o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+1.6)})}catch(e){}
}
const dingDong=()=>{bell(784,0);bell(587,.5)};
/* Level-up celebration: fanfare + fireworks sounds, a small trophy and fireworks */
function noiseBurst(when,dur,freq,vol){
 if(!S.sfx)return;
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const n=Math.floor(actx.sampleRate*dur),buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const src=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
  src.buffer=buf;f.type='bandpass';f.frequency.value=freq;f.Q.value=.7;g.gain.value=vol;
  src.connect(f);f.connect(g);g.connect(actx.destination);src.start(actx.currentTime+when)}catch(e){}
}
function whistle(when){
 if(!S.sfx)return;
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+when;
  o.type='sine';o.frequency.setValueAtTime(500,t0);o.frequency.exponentialRampToValueAtTime(1900,t0+.42);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.05,t0+.05);g.gain.exponentialRampToValueAtTime(.0001,t0+.45);
  o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+.5)}catch(e){}
}

 [1,1.45,1.9].forEach((t,i)=>{whistle(t-.45);noiseBurst(t,.45,900+i*350,.9);noiseBurst(t+.06,1,3200,.25)});
}

function startDay(w,d,replay){
 if(d<0)return;
 const t=replay?0:PLAN[d].findIndex((_,j)=>!S.done[tk(w,d,j)]);
 session={w,d,replay};
 openPlay();runTask(t);
}
function runTask(t){
 const {w,d}=session;const spec=PLAN[d][t];const Wk=WEEKS[w-1];
 session.t=t;
 $('#play-title').textContent=`Week ${w} · ${d===FIN?'Final Mission':'Mission '+(d+1)} · ${TASKS[spec.t].name}`;
 const ctx={words:partOf(Wk,spec.part),all:Wk.words,hard:!!spec.hard,lv:lvOf(w),wk:Wk};
 GAMES[spec.t](ctx,()=>finishTask());
}
function finishTask(){
 const {w,d,t,replay}=session;
 const wasDay=dayComplete(w,d);
 const first=!S.done[tk(w,d,t)];
 S.done[tk(w,d,t)]=true;S.stars+=first?3:1;addPoints(first?30:10);

 if(nowDay&&!wasDay&&!S.dayDone[dk(w,d)])S.dayDone[dk(w,d)]=today();

 if(wkDone&&w<NW)S.assigned=Math.max(S.assigned,w+1);

 const nextT=replay?(t+1<PLAN[d].length?t+1:-1):PLAN[d].findIndex((_,j)=>!S.done[tk(w,d,j)]);

  $('#r-home').onclick=closePlay;
 }

/* ---------- Games ---------- */
function promptFor(t,ctx){
 const p=ctx.lv.prompt;
 if(p==='sentence')return t.ex;
 if(p==='find'&&!ctx.wk.noFind)return `Find the ${t.en}!`;
 return t.en;
}
const GAMES={
 listen(ctx,done){
  const R=ctx.lv.rounds;let i=0;const order=fillTo(ctx.words,R);
  function round(){
   setProg(i,R);const t=order[i];const n=ctx.hard?4:ctx.lv.opts;const pr=promptFor(t,ctx);
   const opts=shuffle([t,...others(t,ctx.all,n-1)]);
   stage.innerHTML=`<div class="q"><button class="speak big" id="g-speak" aria-label="Tekrar dinle">🔊</button><p class="saytxt" lang="en">${esc(pr)}</p><p class="hint">Oku ya da dinle, doğru resme dokun</p></div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-label="Seçenek ${k+1}">${pic(o.p)}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
   $('#g-speak').onclick=()=>say(pr);
   later(()=>say(pr),350);
   let locked=false;
   stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(locked)return;const o=opts[+b.dataset.k];
    if(o===t){locked=true;b.classList.add('ok');good();say(t.en);showFb(t,ctx.lv);later(()=>{i++;i<R?round():done()},1500)}
    else{b.classList.add('no');bad();miss(t);later(()=>b.classList.remove('no'),450);later(()=>say(pr),500)}
   });
  }
  round();
 },
 penalty(ctx,done){
  const R=ctx.lv.rounds;let i=0,goals=0;const order=fillTo(ctx.words,R);
  function round(){
   setProg(i,R);const t=order[i];const n=ctx.hard?4:ctx.lv.opts;
   const opts=shuffle([t,...others(t,ctx.all,n-1)]);
   stage.innerHTML=`<div class="pen"><div class="goal"><div class="keeper" id="keeper">${KEEPER}</div></div><div class="spot"></div><div class="ball" id="ball">⚽</div><div class="score">GOL ${goals}</div><div class="golt" id="golt">GOL!</div></div>
    <div class="qrow"><div class="qpic">${pic(t.p)}</div><div><p class="hint">Bu ne? Doğru kelimeyi seç!</p><button class="speak" id="g-hint">🔊 Hint</button></div></div>
    <div class="opts">${opts.map((o,k)=>`<button class="opt word${wcls(o.en)}" data-k="${k}">${esc(o.en)}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
   $('#g-hint').onclick=()=>say(t.en);
   let locked=false;
   stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(locked)return;locked=true;const o=opts[+b.dataset.k];

     k.style.transform=`translateX(calc(-50% + ${-side*55}px))`;
     later(()=>{$('#golt').classList.add('on');cheer();say(t.en);showFb(t,ctx.lv)},450);
     later(()=>{i++;i<R?round():done()},2000);
    }else{
     b.classList.add('no');bad();miss(t);
     ball.style.transform=`translate(calc(-50% + ${side*60}px),-120px) scale(.65)`;
     k.style.transform=`translateX(calc(-50% + ${side*60}px))`;
     const f=$('#fb');f.textContent='Saved! Kaleci kurtardı, tekrar dene.';f.classList.add('show');
     later(()=>{ball.style.transform='translate(-50%,0)';k.style.transform='translateX(-50%)';b.classList.remove('no');b.disabled=true;b.style.opacity=.35;locked=false},850);
    }
   });
  }
  round();
 },
 race(ctx,done){
  const list=fillTo(ctx.words,4);const total=list.reduce((s,w)=>s+w.en.length,0);let got=0,i=0;
  const pos=()=>`calc(${(got/total)*100}% - ${(got/total)*96}px)`;
  function round(){
   setProg(i,4);const t=list[i];const L=t.en.split('');let p=0;const ghost=i<ctx.lv.ghost;
   const tiles=shuffle(L);
   stage.innerHTML=`<div class="road"><div class="tw-snow"></div><div class="lane"></div><div class="finish"></div><div class="racer" id="racer" style="left:${pos()}">${carSVG('#ef4444',10)}</div></div>
    <div class="qrow"><div class="qpic">${pic(t.p)}</div><div><p class="hint">Harfleri sırayla seç!${ghost?'<br>Silik harfleri takip et.':''}</p><button class="speak" id="g-hint">🔊 Listen</button></div></div>
    <div class="slots">${L.map((c,k)=>`<span class="slot" data-k="${k}">${ghost?`<em>${esc(c)}</em>`:''}</span>`).join('')}</div>
    <div class="tiles">${tiles.map((c,k)=>`<button class="tile" data-k="${k}">${esc(c)}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
   $('#g-hint').onclick=()=>say(t.en);later(()=>say(t.en),350);
   stage.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    if(p>=L.length||b.disabled)return;const c=tiles[+b.dataset.k];
    if(c===L[p]){
     const s=stage.querySelector(`.slot[data-k="${p}"]`);s.textContent=c;s.classList.add('filled');b.disabled=true;p++;got++;tick();
     $('#racer').style.left=pos();
     if(p===L.length){good();say(t.en);showFb(t,ctx.lv);later(()=>{i++;i<4?round():done()},1600)}
    }else{b.classList.add('no');bad();miss(t);later(()=>b.classList.remove('no'),450)}
   });
  }
  round();
 },
 memory(ctx,done){
  const want=ctx.lv.pairs;
  let ws=sample(ctx.words,Math.min(want,ctx.words.length));
  if(ws.length<want)ws=ws.concat(sample(ctx.all.filter(w=>!ws.includes(w)),want-ws.length));
  const cards=shuffle(ws.flatMap((w,id)=>[{id,kind:'p'},{id,kind:'w'}]));
  let open=[],matched=0,busy=false;
  setProg(0,ws.length);
  stage.innerHTML=`<p class="hint center">Kartları çevir: resim ile kelimeyi eşleştir!</p><div class="mem ${ws.length>4?'many':''}">${cards.map((c,k)=>`<button class="mcard" data-k="${k}" aria-label="Kart ${k+1}"><span class="back">?</span><span class="face">${c.kind==='p'?pic(ws[c.id].p):`<b class="${wcls(ws[c.id].en).trim()}">${esc(ws[c.id].en)}</b>`}</span></button>`).join('')}</div><div class="fb" id="fb"></div>`;
  stage.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{
   if(busy||b.classList.contains('up'))return;const c=cards[+b.dataset.k];b.classList.add('up');tick();
   if(c.kind==='w')say(ws[c.id].en);
   open.push([b,c]);
   if(open.length===2){
    const [[b1,c1],[b2,c2]]=open;open=[];
    if(c1.id===c2.id){b1.classList.add('match');b2.classList.add('match');matched++;good();say(ws[c1.id].en);showFb(ws[c1.id],ctx.lv);setProg(matched,ws.length);
     if(matched===ws.length)later(done,1400)}
    else{busy=true;later(()=>{b1.classList.remove('up');b2.classList.remove('up');busy=false},1000)}
   }
  });
 }
};

/* ---------- Fill the Gap (writing) ---------- */
function gapInfo(t){
 const re=new RegExp('\\b('+t.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(s|es)?\\b','i');
 const m=t.ex.match(re);if(!m)return null;
 return {before:t.ex.slice(0,m.index),after:t.ex.slice(m.index+m[1].length)};
}
GAMES.write=function(ctx,done){
 const R=5;let i=0;const order=fillTo(ctx.words,R);const lvn=ctx.lv.n;
 function round(){
  setProg(i,R);const t=order[i];const L=t.en.split('');
  let blanks;
  if(lvn===1){const idx=L.map((_,k)=>k).filter(k=>k>0||L.length===1);blanks=sample(idx,Math.min(idx.length,L.length>=5?2:1))}
  else if(lvn===2){blanks=L.map((_,k)=>k).filter(k=>k>0)}
  else{blanks=L.map((_,k)=>k)}
  const gi=lvn===3?gapInfo(t):null;
  if(lvn===3&&!gi)blanks=L.map((_,k)=>k).filter(k=>k>0);
  const boxes=L.map((c,k)=>blanks.includes(k)?`<input class="gapbox" data-k="${k}" maxlength="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Harf ${k+1}">`:`<span class="gapfix">${esc(c)}</span>`).join('');
  const hint=lvn===1?'Eksik harfi yaz!':gi?'Cümledeki boşluğa kelimeyi yaz!':'Kelimenin geri kalanını yaz!';
  const line=gi?`<p class="gapsent">${esc(gi.before)}<span class="gapword">${boxes}</span>${esc(gi.after)}</p>`:`<div class="gapword big">${boxes}</div>`;
  stage.innerHTML=`<div class="qrow"><div class="qpic">${pic(t.p)}</div><div><p class="hint">${hint}</p><button class="speak" id="g-hint">🔊 Hint</button></div></div>${line}<div class="fb" id="fb"></div>`;
  $('#g-hint').onclick=()=>say(t.en);
  const inputs=[...stage.querySelectorAll('.gapbox')];
  later(()=>{if(inputs[0])inputs[0].focus()},150);
  let finished=false;
  inputs.forEach(inp=>inp.addEventListener('input',()=>{
   if(finished||inp.readOnly)return;
   const v=normKey(inp.value.slice(-1)||'');const k=+inp.dataset.k;
   if(!v)return;
   if(v===L[k].toLowerCase()){
    inp.value=L[k];inp.classList.add('ok');inp.readOnly=true;tick();
    const next=inputs.find(x=>!x.readOnly);
    if(next)next.focus();
    else{finished=true;inp.blur();good();say(gi?t.ex:t.en);showFb(t,ctx.lv);later(()=>{i++;i<R?round():done()},1800)}
   }else{inp.value='';inp.classList.remove('no');void inp.offsetWidth;inp.classList.add('no');bad();miss(t)}
  }));
 }
 round();
};

/* ---------- Penalty Cup: bonus 6th activity of every week ----------
   Opens when the week's 5 missions are done (or the parent's "all open" switch is on).
   Alternating turns: Uras kicks (picture -> pick the word) and saves (hear the word -> tap the picture),
   5 each; tied after that -> sudden death, up to 3 more pairs. Winning gives the week's cup. */
const KEEPER_BLUE=KEEPER.replace(/#ff8c1a/g,'#2f6fed');
/* Penalty Cup also lives in the games menu: pick any open week's cup */
let cupWeek=0;
function renderCupCard(){
 const won=Object.values(S.pcup).filter(x=>x&&x.won).length;
 if(!cupWeek||!cupOpen(cupWeek))cupWeek=cupOpen(view)?view:(WEEKS.find(x=>cupOpen(x.n))||{n:0}).n;
 $('#cup-card').innerHTML=`<div><p class="eyebrow">Football Game</p><h2>Penalty Cup</h2></div>
  <div class="tt-badges"><span class="lvl-badge">🏆 ${won} / ${NW}</span><small>Cups won</small></div>
  ${cupWeek?`<button class="btn" data-act="cupplay">Play Week ${cupWeek} ▶</button>`:'<span class="note">Finish a week\'s '+ND+' missions to open its cup</span>'}
  <div class="tt-levels cup-weeks" role="group" aria-label="Choose a week">${WEEKS.map(x=>{const op=cupOpen(x.n),r=S.pcup[x.n];
   return `<button class="tt-lv${x.n===cupWeek?' on':''}" data-cupw="${x.n}" ${op?'':'disabled'}><b>${op?'':'🔒 '}Week ${x.n}</b><small>${r&&r.won?'🏆 '+esc(r.best):esc(x.en)}</small></button>`}).join('')}</div>`;
}
const cupOpen=w=>S.openAll||weekComplete(w);
function cupCard(){
 const w=view,r=S.pcup[w],op=cupOpen(w),won=!!(r&&r.won);
 const st=won?`Won 🏆 ${r.best}`:op?'Bonus':`After ${ND} missions`;
 const btn=op?`<button class="btn small${won?' ghost':''}" data-act="cup">${won?'Replay':'Play'}</button>`:'<span aria-hidden="true" style="font-size:24px">🔒</span>';
 return `<div class="fx cupfx ${won?'done':op?'cur':'lock'}"><span class="mnum" aria-hidden="true">🏆</span><h3>Penalty Cup</h3><div class="ti"><span>⚽ 5 kicks</span><span>🧤 5 saves</span></div><span class="st">${st}</span>${btn}</div>`;
}
function startCup(w){
 const Wk=WEEKS[w-1],words=Wk.words;
 session={cup:true};openPlay();stage.classList.add('neon');
 const RV=FRIENDS[Math.floor(Math.random()*FRIENDS.length)],RVU=RV.toLocaleUpperCase('tr-TR');
 let me=0,rival=0,turn=0,ki=0,si=0;const mk=[],rk=[];
 const kicks=fillTo(words,8),saves=fillTo(words,8);
 const boardInner=()=>`<div class="pc-board"><span class="pc-team">URAS</span><b>${me}</b><span class="pc-dash">–</span><b>${rival}</b><span class="pc-team">${esc(RVU)}</span></div>
  <div class="pc-marks"><span>${mk.map(x=>x?'⚽':'❌').join(' ')||'&nbsp;'}</span><span>${rk.map(x=>x?'⚽':'🧤').join(' ')||'&nbsp;'}</span></div>`;
 /* Role banner says clearly whose turn it is, so "save" never looks like a miss */
 const board=role=>`<div id="pc-bw">${boardInner()}</div><div class="pc-role ${role==='kick'?'kick':'keep'}">${role==='kick'?'⚽ YOUR KICK':'🧤 YOU ARE THE GOALKEEPER'}</div>`;
 const updBoard=()=>{const b=$('#pc-bw');if(b)b.innerHTML=boardInner()};
 const label=()=>turn>=10?'Sudden death':`${turn%2===0?'Kick':'Save'} ${Math.floor(turn/2)+1} / 5`;

 function next(){
  if(turn>=10&&turn%2===0&&(me!==rival||turn>=16))return end();
  setProg(Math.min(turn,10),10);
  $('#play-title').textContent=`Penalty Cup · Week ${w} · ${label()}`;
  turn%2===0?kick():keep();
 }
 /* Big result text: green when Uras did well, red when not */
 const cupFb=en=>{const f=$('#fb');if(f){f.innerHTML=`<span><b>${esc(en)}</b></span>`;f.classList.add('show')}};
 function flash(t,sub,ok){const g=$('#golt');if(g){g.innerHTML=`<span>${t}<small>${sub}</small></span>`;g.className='golt '+(ok?'pc-good':'pc-bad');void g.offsetWidth;g.classList.add('on')}}
 function kick(){
  const t=kicks[ki++%kicks.length],opts=shuffle([t,...others(t,words,2)]);
  stage.innerHTML=board('kick')+scene(KEEPER)+`<div class="qrow"><div class="qpic">${pic(t.p)}</div><div><p class="hint">What is it? Pick the word and shoot!</p><button class="speak" id="g-hint">🔊 Hint</button></div></div>
   <div class="opts">${opts.map((o,k)=>`<button class="opt word${wcls(o.en)}" data-k="${k}">${esc(o.en)}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
  $('#g-hint').onclick=()=>say(t.en);
  let locked=false;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   if(locked)return;locked=true;const ok=opts[+b.dataset.k]===t,side=Math.random()<.5?-1:1,ball=$('#ball'),k=$('#keeper'),f=$('#fb');
   if(ok){b.classList.add('ok');me++;mk.push(1);ball.style.transform=`translate(calc(-50% + ${side*85}px),-150px) scale(.55)`;k.style.transform=`translateX(calc(-50% + ${-side*55}px))`;
    later(()=>{flash('✓ GOAL! ⚽','Right word!',true);updBoard();cheer();say(t.en);cupFb(t.en)},450)}
   else{b.classList.add('no');mk.push(0);miss(t);bad();ball.style.transform=`translate(calc(-50% + ${side*60}px),-120px) scale(.65)`;k.style.transform=`translateX(calc(-50% + ${side*60}px))`;
    later(()=>{flash('✗ MISSED','Wrong word',false);updBoard();f.innerHTML=`<span>The keeper stopped it. It was <b>${esc(t.en)}</b></span>`;f.classList.add('show');say(t.en)},450)}
   later(()=>{turn++;next()},2100);
  });
 }
 function keep(){
  const t=saves[si++%saves.length],opts=shuffle([t,...others(t,words,2)]);
  stage.innerHTML=board('keep')+scene(KEEPER_BLUE)+`<div class="q"><button class="speak big" id="g-speak" aria-label="Listen again">🔊</button><p class="hint">${esc(RV)} kicks! Listen and tap the picture to save the ball!</p></div>
   <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${pic(o.p)}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
  $('#g-speak').onclick=()=>say(t.en);later(()=>say(t.en),350);
  let locked=false;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   if(locked)return;locked=true;const ok=opts[+b.dataset.k]===t,side=Math.random()<.5?-1:1,ball=$('#ball'),k=$('#keeper'),f=$('#fb');
   if(ok){b.classList.add('ok');rk.push(0);k.style.transform=`translateX(calc(-50% + ${side*60}px))`;ball.style.transform=`translate(calc(-50% + ${side*60}px),-110px) scale(.7)`;
    later(()=>{flash('✓ SAVED! 🧤','Right picture!',true);updBoard();good();say(t.en);cupFb(t.en)},450)}
   else{b.classList.add('no');rival++;rk.push(1);miss(t);bad();k.style.transform=`translateX(calc(-50% + ${-side*55}px))`;ball.style.transform=`translate(calc(-50% + ${side*85}px),-150px) scale(.55)`;
    later(()=>{flash(`✗ ${esc(RVU)} SCORES`,'Wrong picture',false);updBoard();f.innerHTML=`<span>${esc(RV)} scored. It was <b>${esc(t.en)}</b></span>`;f.classList.add('show');say(t.en)},450)}
   later(()=>{turn++;next()},2100);
  });
 }
 function end(){
  setProg(10,10);
  const won=me>rival,draw=me===rival,prev=S.pcup[w],score=`${me}–${rival}`;
  if(won&&!(prev&&prev.won))S.pcup[w]={won:true,best:score};else if(!prev)S.pcup[w]={won:false,best:score};
  save();
  const pts=won?(prev&&prev.won?10:50):5;addPoints(pts);
  stage.innerHTML=`<div class="res">${won?'<div class="fw-space"></div>':''}<h2>${won?'You won the Penalty Cup!':draw?'Draw!':'So close!'}</h2><p class="pc-final">URAS ${me} – ${rival} ${esc(RVU)}</p><p>${won?'Champion of Week '+w+'!':'Try again, you can do it!'} · +${pts} points</p>
   <div class="row"><button class="btn" id="pc-again">${won?'Play again':'Try again'}</button><button class="btn ghost" id="pc-back">Back to week</button></div></div>`;
  if(won)celebrate(['Champion! You won the cup, Uras!','']);else say(draw?'Draw! Try again!':'So close! Try again!');
  $('#pc-again').onclick=()=>startCup(w);$('#pc-back').onclick=closePlay;
 }
 next();
}

/* ---------- Chant Time: 6th (bonus) card of every week ----------
   4 rounds: the sentence of the week, then example sentences of 3 week words (last round has 2 gaps).
   The sentence is read, then a drum beat lights the words one by one; at a gap the beat waits until
   the right word is tapped (no time pressure). At the end the whole sentence is read: "Chant it!" */
function chantCard(){
 const s=S.chant[view]||0;
 return `<div class="fx chantfx ${s?'done':'open'}"><span class="mnum" aria-hidden="true">🥁</span><h3>Chant Time</h3><div class="ti"><span>🥁 Clap the beat</span><span>🗣️ Say the sentence</span></div><span class="st">${s?'Completed ✓ '+'★'.repeat(s):'Bonus'}</span><button class="btn small${s?' ghost':''}" data-act="chant">${s?'Replay':'Play'}</button></div>`;
}
function startChant(w){
 const Wk=WEEKS[w-1];session={chant:true};openPlay();stage.classList.add('neon');
 const BEAT=650,clean=t=>t.replace(/[^A-Za-z']/g,'').toLowerCase();
 const exs=sample(Wk.words.filter(x=>x.ex),3);
 const rounds=[{text:Wk.chunk,key:null,gaps:1}].concat(exs.map((x,i)=>({text:x.ex,key:x.en,gaps:i===2?2:1})));
 let ri=0,mist=0;
 function beat(){const d=$('#ch-drum');if(d){d.classList.remove('hit');void d.offsetWidth;d.classList.add('hit')}tone(110,.14,'sine',.35);tone(220,.05,'triangle',.08)}
 function round(){
  const R=rounds[ri],T=R.text.split(' ');
  const cand=T.map((_,i)=>i).filter(i=>clean(T[i]).length>=3);let gaps=[];
  if(R.key){const k=T.findIndex(t=>clean(t).startsWith(R.key.toLowerCase()));if(k>=0)gaps.push(k)}
  while(gaps.length<R.gaps&&cand.length){const c=cand.splice(Math.floor(Math.random()*cand.length),1)[0];if(!gaps.includes(c))gaps.push(c)}
  if(!gaps.length)gaps=[T.length-1];
  setProg(ri,rounds.length);$('#play-title').textContent=`Chant Time · Week ${w} · Round ${ri+1} / ${rounds.length}`;
  stage.innerHTML=`<p class="hint center">Önce dinle. Sonra ritim boşluğa gelince doğru kelimeye dokun!</p>
   <div class="ch-line" id="ch-line">${T.map((t,i)=>`<span class="ch-w${gaps.includes(i)?' gap':''}" data-i="${i}">${gaps.includes(i)?'_____':esc(t)}</span>`).join(' ')}</div>
   <div class="ch-drum" id="ch-drum" aria-hidden="true">🥁</div>
   <div class="opts" id="ch-opts"></div><div class="fb" id="fb"></div>`;
  let pos=0;
  const w_=i=>stage.querySelector(`.ch-w[data-i="${i}"]`);
  function step(){
   const el=w_(pos);if(!el)return;
   stage.querySelectorAll('.ch-w.now').forEach(e=>e.classList.remove('now'));el.classList.add('now');beat();
   if(gaps.includes(pos)&&!el.classList.contains('filled')){ask(pos);return}
   pos++;later(pos<T.length?step:finishRound,BEAT);
  }
  function ask(i){
   const right=T[i].replace(/[.,!?]/g,''),rc=clean(right);
   const pool=[...new Set(Wk.words.map(x=>x.en).concat(T.map(t=>t.replace(/[.,!?]/g,''))).filter(x=>clean(x)!==rc&&clean(x).length>1))];
   const opts=shuffle([right,...sample(pool,2)]);
   const box=$('#ch-opts');
   box.innerHTML=opts.map((o,k)=>`<button class="opt word${wcls(o)}" data-k="${k}">${esc(o)}</button>`).join('');
   box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(clean(opts[+b.dataset.k])===rc){b.classList.add('ok');good();const el=w_(i);el.textContent=T[i];el.classList.add('filled');box.innerHTML='';pos++;later(pos<T.length?step:finishRound,BEAT)}
    else{b.classList.add('no');bad();mist++;later(()=>b.classList.remove('no'),450)}
   });
  }
  function finishRound(){
   stage.querySelectorAll('.ch-w.now').forEach(e=>e.classList.remove('now'));$('#ch-line').classList.add('all');say(R.text);
   const f=$('#fb');f.innerHTML='<span><b>Chant it!</b> Cümleyi sen de yüksek sesle söyle!</span>';f.classList.add('show');
   const box=$('#ch-opts');box.className='row';
   box.innerHTML=`<button class="speak" id="ch-again">🔊 Again</button><button class="btn" id="ch-next">${ri+1<rounds.length?'Next ▶':'Finish ▶'}</button>`;
   $('#ch-again').onclick=()=>say(R.text);
   $('#ch-next').onclick=()=>{ri++;ri<rounds.length?round():finish()};
  }
  say(R.text);later(step,900+R.text.length*75);
 }
 function finish(){
  const stars=mist===0?3:mist<=3?2:1,first=!S.chant[w];
  if(stars>(S.chant[w]||0))S.chant[w]=stars;save();
  const pts=first?20:5;addPoints(pts);setProg(1,1);
  stage.innerHTML=`<div class="res"><div class="fw-space"></div><h2>Chant Time complete!</h2><p class="vq-stars" aria-label="${stars} / 3"><span class="on">${'★'.repeat(stars)}</span><span class="off">${'★'.repeat(3-stars)}</span></p><p>+${pts} points</p>
   <div class="row"><button class="btn" id="ch-replay">Play again</button><button class="btn ghost" id="ch-back">Back to week</button></div></div>`;
  celebrate(['Great chanting, Uras!','Harika söyledin Uras!']);
  $('#ch-replay').onclick=()=>startChant(w);$('#ch-back').onclick=closePlay;
 }
 round();
}

const TYPE_POOLS=[
 ['cat','dog','red','car','bus','one','two','six','ten','yes','hat','arm','leg','egg','run'],
 ['ball','blue','goal','fish','jump','book','bike','milk','nose','door','four','five','nine','pink','game','lion','bird','baby','coat','stop'],
 ['green','seven','apple','train','robot','horse','house','water','three','black','white','bread','mouth','sunny','teddy','eight'],
 ['orange','yellow','rabbit','monkey','father','mother','pencil','window','sister','garden','purple','school'],
 ['red car','big ball','blue bus','my dog','go left','run fast','green apple','two goals','fast car','hello Uras','hello Defne','hi Kuzey','run Aras'],
 ['I like cars.','Kick the ball!','I am seven.','My car is red.','Hello, I am Uras.','Ready, set, go!','I can jump.','Open the door.','Kuzey is my friend.','Pass the ball, Aras!','Hello, Dora!','Defne likes cats.','Asel has a pen.']

const WPL=10; /* words per Typing Turbo level */
let typingKey=null;
document.addEventListener('keydown',e=>{if(typingKey)typingKey(e)});
const TT_NAMES=['3 letters','4 letters','5 letters','6+ letters','2 words','sentences'];
function renderTypingCard(){
 const t=S.typing,top=TYPE_POOLS.length;
 const open=n=>n<=t.best||S.openAll; /* reached levels, or all when the parent's "all open" switch is on */
 $('#typing-card').innerHTML=`<div><p class="eyebrow">Keyboard Game · <span lang="tr">klavye oyunu</span></p><h2>Typing Turbo</h2></div>
  <div class="tt-badges"><span class="lvl-badge">Level ${t.level}</span><small>Best: Level ${t.best}</small></div>
  <button class="btn" data-act="typing">Play ▶</button>
  <div class="tt-levels" role="group" aria-label="Seviye seç">${Array.from({length:top},(_,i)=>i+1).map(n=>`<button class="tt-lv${n===Math.min(t.level,top)?' on':''}" data-ttlv="${n}" ${open(n)?'':'disabled'}><b>${open(n)?'':'🔒 '}Level ${n}</b><small>${TT_NAMES[n-1]}</small></button>`).join('')}</div>`;
}
function startTyping(){
 session={typing:true};openPlay();stage.classList.add('neon');$('#play-title').textContent='Typing Turbo';
 let level=S.typing.level,list,wi,pos,letters,totalL,doneL;
 const typable=c=>/[a-z ]/i.test(c);
 const skip=()=>{while(pos<letters.length&&!typable(letters[pos]))pos++};
 const carPos=()=>{const p=totalL?doneL/totalL:0;return `calc(${p*100}% - ${p*96}px)`};
 const pool=()=>TYPE_POOLS[Math.min(level,TYPE_POOLS.length)-1];
 function startLevel(){list=sample(pool(),WPL);wi=0;doneL=0;totalL=list.reduce((s,w)=>s+w.split('').filter(typable).length,0);nextWord()}
 function nextWord(){setProg(wi,WPL);const w=list[wi];pos=0;letters=w.split('');skip();render();later(()=>say(w),300)}
 function render(){
  const w=list[wi];const fw=findWord(w.toLowerCase());
  stage.innerHTML=`<div class="tt-top"><span class="lvl-badge">Level ${level}</span><span class="tt-count">Word ${wi+1} / ${WPL}</span><button class="speak" id="tt-say" aria-label="Dinle">🔊 Listen</button></div>
   <div class="road"><div class="tw-snow"></div><div class="lane"></div><div class="finish"></div><div class="racer" id="racer" style="left:${carPos()}">${carSVG('#2f6fed',level)}</div></div>
   ${fw||trOf(w)?`<div class="tt-picrow">${fw?`<div class="tt-pic">${pic(fw.p)}</div>`:''}${trOf(w)?`<span class="tt-tr" lang="tr">${esc(trOf(w))}</span>`:''}</div>`:''}
   <div class="tt-word" id="tt-word" aria-live="polite">${lettersHTML(letters,pos)}</div>
   <p class="hint center">Klavyeden ya da aşağıdaki tuşlardan yaz.</p>
   <div class="kb">${['qwertyuiop','asdfghjkl','zxcvbnm'].map(r=>`<div class="kb-row">${r.split('').map(ch=>`<button class="key" data-key="${ch}" tabindex="-1">${ch}</button>`).join('')}</div>`).join('')}<div class="kb-row"><button class="key space" data-key=" " tabindex="-1">space</button></div></div>`;
  $('#tt-say').onclick=()=>say(w);
  stage.querySelectorAll('.key').forEach(b=>b.onclick=()=>press(b.dataset.key));
 }
 function paint(){$('#tt-word').querySelectorAll('[data-k]').forEach(s=>{const k=+s.dataset.k;s.className=(k<pos?'d':k===pos?'c':'')+(letters[k]===' '?' sp':'')});$('#racer').style.left=carPos()}
 function press(ch){
  if(!$('#tt-word')||pos>=letters.length)return;
  if(normKey(ch)===normKey(letters[pos])){
   pos++;doneL++;skip();tick();paint();
   if(pos>=letters.length){good();say(list[wi]);addPoints(2);wi++;if(wi>=WPL)levelUp();else later(nextWord,900)}
  }else{bad();const c=$('#tt-word .c');if(c){c.classList.remove('x');void c.offsetWidth;c.classList.add('x')}}
 }
 function levelUp(){
  level++;S.typing.level=level;S.typing.best=Math.max(S.typing.best,level);save();setProg(WPL,WPL);addPoints(20);
  const pr=praise();later(()=>celebrate(pr),1150);
  later(()=>{
   stage.innerHTML=`<div class="res"><div class="fw-space"></div><h2>Level up!</h2><p class="carname">Level ${level}</p><div class="row"><button class="btn" id="tt-next">Next level ▶</button><button class="btn ghost" id="tt-stop">Stop</button></div></div>`;
   $('#tt-next').onclick=startLevel;$('#tt-stop').onclick=closePlay},1100);
 }
 typingKey=e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(!$('#tt-word'))return;const k=normKey(e.key);if(k.length===1&&(k===' '||/\p{L}/u.test(k))){e.preventDefault();press(k)}};
 startLevel();
}

 }
 function quizStart(){qs=sample(pack,Math.min(5,pack.length));qi=0;quiz()}

  $('#play-title').textContent=title()+' · Quiz';setProg(qi,qs.length);

  stage.innerHTML=`<div class="q"><button class="speak big" id="g-speak" aria-label="Tekrar dinle">🔊</button><p class="saytxt" lang="en">${esc(t.en)}</p><p class="hint">${usePics?'Doğru resme dokun!':'Doğru Türkçe anlamı seç!'}</p></div>
   <div class="opts">${opts.map((o,k)=>`<button class="opt${usePics?'':' word'+wcls(o.tr)}" data-k="${k}">${usePics?pic(o.p):esc(o.tr)}</button>`).join('')}</div><div class="fb" id="fb"></div><p class="center vq-count">Question ${qi+1} / ${qs.length}</p>`;

  });

 function finish(){
  const stars=mist===0?3:mist<=2?2:1,key=vqKey(n,p),first=!S.vq[key];

   <div class="row">${nextP>=0?'<button class="btn" id="vq-nextp">Next pack ▶</button>':lvlDone&&n<VOCAB_LEVELS.length?`<button class="btn" id="vq-nextl">Level ${n+1} ▶</button>`:''}<button class="btn ghost" id="vq-again">Play again</button><button class="btn ghost" id="vq-map">Map</button></div></div>`;
  celebrate(lvlDone?['Level complete, Uras! New words unlocked!','Seviye bitti Uras! Yeni kelimeler açıldı!']:praise());

 }

}
const TOWER_STAGES=[['Warm-up','hafta kelimeleri + 3–4 harf'],['Rookie','5 harf'],['Pro','6–7 harf'],['Star','8+ harf'],['Captain','iki kelime'],['Legend','tam cümle']];
const TOWER_PER=10,TOWER_TOP=TOWER_PER*TOWER_STAGES.length;
function towerPools(){
 const all=[],seen=new Set();
 WEEKS.flatMap(x=>x.words).concat(TOWER_EXTRA,VOCAB_ALL).forEach(w=>{const k=w.en.toLowerCase();if(!seen.has(k)){seen.add(k);all.push(w)}});
 const L=w=>w.en.length,one=all.filter(w=>!/ /.test(w.en));
 const wk=WEEKS[view-1].words;
 return [
  wk.concat(one.filter(w=>L(w)<=4&&!wk.includes(w))),
  one.filter(w=>L(w)===5),
  one.filter(w=>L(w)>=6&&L(w)<=7),
  one.filter(w=>L(w)>=8),
  all.filter(w=>/ /.test(w.en)&&!/[.?!]$/.test(w.en)),
  all.filter(w=>/[.?!]$/.test(w.en))
 ];
}
function renderTowerCard(){
 $('#tower-card').innerHTML=`<div><p class="eyebrow">Jump Game · <span lang="tr">zıplama oyunu</span></p><h2>Word Tower</h2></div>
  <div class="tt-badges"><span class="lvl-badge">🏔 ${S.tower.best}m</span><small>Best height</small></div>
  <button class="btn" data-act="tower">Play ▶</button>`;
}
function startTower(){
 session={tower:true};openPlay();stage.classList.add('neon');$('#play-title').textContent='Word Tower';$('#prog').innerHTML='';
 const pools=towerPools(),queues=pools.map(()=>[]);
 const stageOf=f=>f<=TOWER_TOP?Math.min(Math.floor((f-1)/TOWER_PER),pools.length-1):3+(f%3);
 const nextW=f=>{const s=stageOf(f);if(!queues[s].length)queues[s]=s===0?shuffle(pools[0].slice(0,WEEKS[view-1].words.length)).concat(shuffle(pools[0].slice(WEEKS[view-1].words.length))):shuffle(pools[s]);return queues[s].shift()};
 const GAP=74,PW=44,M=5,surf=i=>14+i*GAP;
 const typable=c=>/[a-z ]/i.test(c);
 const plats=[{x:50-PW/2,w:null}];
 let floor=0,built=0,letters=null,pos=0;
 stage.innerHTML=`<div class="tt-top"><span class="lvl-badge" id="tw-m">🏔 0m</span><span class="tt-count" id="tw-stage"></span><button class="speak" id="tw-say" aria-label="Dinle">🔊 Listen</button></div>
  <div class="tower"><div class="tw-snow"></div><div class="tw-world" id="tw-world"><div class="tw-ground"></div><div class="tw-kid" id="tw-kid">${KID}</div></div></div>
  <div class="tw-q"><div class="tt-pic" id="tw-pic"></div><div><div class="tt-word" id="tw-word" aria-live="polite"></div><p class="tw-tr" id="tw-tr"></p></div></div>
  <div class="kb">${['qwertyuiop','asdfghjkl','zxcvbnm'].map(r=>`<div class="kb-row">${r.split('').map(ch=>`<button class="key" data-key="${ch}" tabindex="-1">${ch}</button>`).join('')}</div>`).join('')}<div class="kb-row" id="tw-space" hidden><button class="key space" data-key=" " tabindex="-1">space</button></div></div>`;
 const world=$('#tw-world'),kid=$('#tw-kid');
 function build(){while(built<floor+7){built++;const w=nextW(built);const long=w.en.length>10;const prev=plats[built-1].x;let x;
   if(long)x=50-PW/2+(Math.random()*16-8);else do{x=6+Math.random()*(100-PW-12)}while(Math.abs(x-prev)<12);
   plats[built]={x,w};
   const d=document.createElement('div');d.className='tw-plat'+(built%TOWER_PER===0?' gold':'');d.id='tw-p'+built;d.style.cssText=`left:${x}%;width:${PW}%;bottom:${surf(built)-12}px`;
   d.innerHTML=`<span class="tw-lab${long?' long':''}">${esc(w.en)}</span>`;world.appendChild(d)}}
 function place(){const c=plats[floor].x+PW/2;kid.style.left=`calc(${c}% - 23px)`;kid.style.bottom=surf(floor)+'px';world.style.transform=`translateY(${Math.max(0,surf(floor)-60)}px)`;
  world.querySelectorAll('.tw-plat.next').forEach(e=>e.classList.remove('next'));const n=$('#tw-p'+(floor+1));if(n)n.classList.add('next');const o=$('#tw-p'+floor);if(o)o.classList.add('done')}
 const skip=()=>{while(pos<letters.length&&!typable(letters[pos]))pos++};
 function paint(){const el=$('#tw-word');el.classList.toggle('long',letters.length>10);el.innerHTML=lettersHTML(letters,pos)}
 function load(){
  if(!$('#tw-word'))return;const w=plats[floor+1].w;const s=stageOf(floor+1);
  letters=w.en.split('');pos=0;skip();
  $('#tw-pic').innerHTML=w.p?pic(w.p):'';$('#tw-tr').textContent=w.tr||'';
  $('#tw-space').hidden=!/ /.test(w.en);
  $('#tw-stage').textContent=floor+1>TOWER_TOP?`Bonus · Floor ${floor+1}`:`Level ${s+1}/6 · ${TOWER_STAGES[s][0]} · Word ${(floor%TOWER_PER)+1}/${TOWER_PER} · Floor ${floor+1}/${TOWER_TOP}`;
  paint();later(()=>say(w.en),300)}
 function press(ch){
  if(!$('#tw-word')||!letters||pos>=letters.length)return;
  if(normKey(ch)===normKey(letters[pos])){pos++;skip();tick();paint();if(pos>=letters.length)jump()}
  else{bad();miss(plats[floor+1].w);const c=$('#tw-word .c');if(c){c.classList.remove('x');void c.offsetWidth;c.classList.add('x')}kid.classList.remove('oops');void kid.offsetWidth;kid.classList.add('oops')}
 }
 function banner(t,sub){const b=document.createElement('div');b.className='tw-banner';b.innerHTML=`<b>${t}</b><small>${sub}</small>`;$('.tower').appendChild(b);later(()=>b.remove(),1900)}
 function jump(){
  const w=plats[floor+1].w;good();say(w.en);
  floor++;build();kid.classList.remove('hop','oops');void kid.offsetWidth;kid.classList.add('hop');place();
  const m=floor*M;$('#tw-m').textContent='🏔 '+m+'m';
  if(m>S.tower.best){S.tower.best=m;save()}
  addPoints(floor%TOWER_PER===0?22:2);
  letters=null;
  /* Every 10 words: celebration + a "Next level" pause, like Typing Turbo */
  if(floor%TOWER_PER===0){
   const top=floor===TOWER_TOP;
   later(()=>{nextPanel(floor/TOWER_PER,top);celebrate(top?['You made it to the top, Uras!','Kulenin tepesine çıktın Uras!']:praise())},500);
   return;
  }
  let wait=800;
  if(floor%5===0){wait=1100;later(dingDong,500)}
  later(load,wait);
 }
 function nextPanel(lvl,top){
  const s=stageOf(floor+1),bonus=floor+1>TOWER_TOP;
  const p=document.createElement('div');p.className='tw-next';
  p.innerHTML=`<div class="tw-card"><div class="fw-space"></div><span class="tw-lvl">Level ${lvl} complete!</span><span class="tw-sub">${top?'Zirvedesin! Bonus katlar başlıyor.':bonus?'Sıradaki: Bonus katlar':`Sıradaki: Level ${s+1} · ${TOWER_STAGES[s][0]} (${TOWER_STAGES[s][1]})`}</span><div class="row"><button class="btn" id="tw-next">Next level ▶</button><button class="btn ghost small" id="tw-stop">Stop</button></div></div>`;
  stage.appendChild(p);
  $('#tw-next').onclick=()=>{p.remove();load()};$('#tw-stop').onclick=closePlay;
  later(()=>{const b=$('#tw-next');if(b)b.focus()},150);
 }
 build();place();load();
 $('#tw-say').onclick=()=>say(plats[floor+1].w.en);
 stage.querySelectorAll('.key').forEach(b=>b.onclick=()=>press(b.dataset.key));
 typingKey=e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(!$('#tw-word'))return;const k=normKey(e.key);if(k.length===1&&(k===' '||/\p{L}/u.test(k))){e.preventDefault();press(k)}};
}

 function insertRef(z,x,y,self){
  for(const t of [...z.querySelectorAll('.sb-tile')].filter(t=>t!==self)){const r=t.getBoundingClientRect();if(y<r.top)return t;if(y<=r.bottom&&x<r.left+r.width/2)return t}
  return null;

 function bindTile(el){
  el.addEventListener('pointerdown',e=>{
   if(el.disabled||(e.button&&e.button>0))return;e.preventDefault();
   drag={el,x0:e.clientX,y0:e.clientY,moved:false,ghost:null};
   try{el.setPointerCapture(e.pointerId)}catch(_){}

   if(!drag||drag.el!==el)return;

  });

   if(!drag||drag.el!==el)return;const d=drag;drag=null;

  paintPara(last);

   <div class="stat"><small>Streak · seri</small><b>${streak()} days</b></div>
  </div>

  <div id="photo-edit"><h3>Player Card Photo</h3>
   <div class="photo-edit">${stickerHTML()}
    <div style="display:grid;gap:10px">
     ${S.photo?`<label class="field" for="ph-z">Yakınlaştır<input type="range" id="ph-z" min="1" max="4" step="0.05" value="${S.ph.z}"></label>
     <label class="field" for="ph-x">Sola / sağa<input type="range" id="ph-x" min="0" max="100" step="1" value="${S.ph.x}"></label>
     <label class="field" for="ph-y">Yukarı / aşağı<input type="range" id="ph-y" min="0" max="100" step="1" value="${S.ph.y}"></label>`:''}
     <div class="row" style="justify-content:flex-start"><label for="photo-in" class="btn small" style="cursor:pointer">Başka fotoğraf seç</label>${S.photo?'<button class="link" id="ph-del">Varsayılan fotoğrafa dön</button>':''}</div>
     <p class="note">${S.photo?'Bu cihazda seçilen fotoğraf gösteriliyor. Yalnızca bu tarayıcıda saklanır, internete yüklenmez. Yüzü ortalamak için kaydırıcıları kullanın.':'Varsayılan fotoğraf gösteriliyor (uras-sticker.jpg). Başka bir fotoğraf seçerseniz yalnızca bu cihazda saklanır.'}</p>
    </div></div></div>

  <div class="pgrid">
   <label class="field" for="p-rate">Konuşma hızı
    <select id="p-rate"><option value="0.7" ${S.rate<=0.7?'selected':''}>Yavaş</option><option value="0.8" ${S.rate>0.7&&S.rate<0.9?'selected':''}>Orta</option><option value="0.95" ${S.rate>=0.9?'selected':''}>Normal</option></select></label>
   <label class="field" for="p-voice">İngilizce ses
    <select id="p-voice">${(()=>{if(!voice)pickVoice();const vs=enVoices().sort((a,b)=>voiceScore(b)-voiceScore(a));return vs.length?vs.map(v=>`<option value="${esc(v.name)}" ${voice&&v.name===voice.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join(''):'<option value="">İngilizce ses bulunamadı</option>'})()}</select></label>
   <label class="field" for="p-uras">"Uras" nasıl okunsun?
    <select id="p-uras">${['Oorahss','Oo-rahs','Oorass','Ooras','Urahs'].map(v=>`<option value="${v}" ${(S.urasSay||'Oorahss')===v?'selected':''}>${v}</option>`).join('')}</select></label>
  </div>
  <div class="row" style="justify-content:flex-start"><button class="btn small" id="p-test">🔊 Sesi test et: "Run, run, run! This is my teacher."</button></div>
  ${enVoices().length?'<p class="note">En doğal sesler genelde adında "Natural", "Online" ya da "Google US English" geçenlerdir. Kelimeler Türkçe gibi okunuyorsa listeden başka bir ses seçin.</p>':'<p class="note danger" style="padding:10px;border-radius:12px"><b>Bu cihazda İngilizce ses yok.</b> Bu yüzden kelimeler Türkçe okunuyor (örneğin "teacher" → "cafer"). Çözüm: <b>Windows:</b> Ayarlar → Saat ve dil → Konuşma → Ses ekle → English (United States). <b>Android:</b> Ayarlar → Erişilebilirlik → Metin okuma → Google motoru → English (US) ses verilerini yükleyin. <b>iPad/iPhone:</b> Ayarlar → Erişilebilirlik → Seslendirilen İçerik → Sesler → English. Ya da Chrome veya Edge tarayıcısını kullanın. Sonra sayfayı yenileyin.</p>'}
  <p class="note">12 haftanın hepsi açık. Uras yol haritasından istediği haftayı seçebilir.</p>
  <label class="check" for="p-open"><input type="checkbox" id="p-open" ${S.openAll?'checked':''}> Tüm maçlar açık (kapatırsanız maçlar sırayla açılır)</label>
  <label class="check" for="p-lock"><input type="checkbox" id="p-lock" ${S.lock?'checked':''}> Günde tek maç (bir sonraki maç ertesi gün açılır)</label>
  <label class="check" for="p-sfx"><input type="checkbox" id="p-sfx" ${S.sfx?'checked':''}> Ses efektleri</label>

  <div><h3>12-Week Plan · kolaydan zora</h3>
   <div class="tablewrap"><table><thead><tr><th>Week</th><th>Topic</th><th>Curriculum · müfredat</th><th>Words</th><th>Progress</th></tr></thead><tbody>
   ${WEEKS.map(x=>`<tr class="${x.n===cur?'cur':''}"><td>${x.n}<br><small>Level ${x.lv}</small></td><td><b>${esc(x.en)}</b> <small>(${esc(x.tr)})</small><br><small>${esc(x.chunk)}</small></td><td>${esc(x.src)}</td><td>${x.words.map(w=>esc(w.en)).join(', ')}</td><td>${PLAN.filter((_,dd)=>dayComplete(x.n,dd)).length}/${ND}</td></tr>`).join('')}
   </tbody></table></div>
   <p class="note" style="margin-top:8px">Zorluk: Seviye 1'de 3 seçenek ve silik harf ipuçları var. Seviye 2'de "Find the ..." gibi kısa yönergeler gelir ve ipuçları azalır. Seviye 3'te 4 seçenek ve 6 kart çifti var. Kelime tam cümle içinde dinlenir, harf ipucu verilmez.</p></div>

  <div><h3>Tricky Words · zorlandığı kelimeler</h3>
   ${top.length?`<ul class="mlist">${top.map(([en,c])=>{const w=findWord(en);return `<li><button class="speak" data-word="${esc(en)}" aria-label="${esc(en)} dinle">🔊</button><b>${esc(en)}</b> ${w?'· '+esc(w.tr):''}<span>${c} hata</span></li>`}).join('')}</ul>`:'<p class="note">Henüz hata kaydı yok.</p>'}</div>

  <div><h3>ADHD Tips · DEHB için ipuçları</h3>
   <ul class="tips"><li>Her gün aynı saatte kısa bir oturum yapın: 1 maç yeter (yaklaşık 10 dk).</li><li>Görevler arasındaki hareket molasını atlamayın, dikkati tazeler.</li><li>Yanlış cevabın cezası yok, sadece tekrar var. Sonucu değil çabayı övün.</li><li>Haftanın cümlesini gün içinde oyunda kullanın, örneğin "Pass me the <b>blue</b> car!".</li></ul></div>

  <div class="row" style="justify-content:flex-start"><button class="btn small ghost" id="p-reset">İlerlemeyi sıfırla</button><span id="p-confirm" hidden><button class="btn small danger" id="p-reset-yes">Evet, ilerlemeyi sil</button> <button class="link" id="p-reset-no">Vazgeç</button></span></div>
  <p class="note">İlerleme bu cihazdaki tarayıcıda saklanır. Başka cihazdan açılırsa sıfırdan başlar. Sıfırlama fotoğrafı silmez.</p>`;
 $('#p-rate').onchange=e=>{S.rate=+e.target.value;save();say('Hello Uras!')};
 $('#p-voice').onchange=e=>{S.voiceName=e.target.value||null;save();voice=null;pickVoice();say('Run, run, run! This is my teacher.')};
 $('#p-test').onclick=()=>say('Run, run, run! This is my teacher.');
 $('#p-uras').onchange=e=>{S.urasSay=e.target.value;save();say('Hello Uras! Great job, Uras!')};
 $('#p-lock').onchange=e=>{S.lock=e.target.checked;save()};
 $('#p-open').onchange=e=>{S.openAll=e.target.checked;save()};
 $('#p-sfx').onchange=e=>{S.sfx=e.target.checked;save()};
 ['z','x','y'].forEach(k=>{const el=$('#ph-'+k);if(el)el.oninput=()=>{S.ph[k]=+el.value;const img=$('#photo-edit .ph img');
  if(img){img.style.objectPosition=`${S.ph.x}% ${S.ph.y}%`;img.style.transformOrigin=`${S.ph.x}% ${S.ph.y}%`;img.style.transform=`scale(${S.ph.z})`}save()}});
 const del=$('#ph-del');if(del)del.onclick=()=>{S.photo=null;save();renderParent()};
 $('#sheet-in').querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>say(b.dataset.word));
 $('#p-reset').onclick=()=>{$('#p-confirm').hidden=false};
 $('#p-reset-no').onclick=()=>{$('#p-confirm').hidden=true};
 $('#p-reset-yes').onclick=()=>{S=Object.assign({},DEF,{done:{},dayDone:{},mistakes:{},secs:{},photo:S.photo,ph:S.ph,rate:S.rate,sfx:S.sfx,typing:{level:1,best:1},tower:{best:0},sb:{},points:0,badges:{},vbSeen:{},vq:{},pcup:{},chant:{}});view=1;save();renderParent()};
}

checkBadges(true); /* badges already earned before this feature existed, without pop-ups */
renderHome();
})();
</script>
